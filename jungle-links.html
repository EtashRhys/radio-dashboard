<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungle's Links</title>
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jungle's Links">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px;
  }
  h1 {
    font-size: 1.4rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8b949e;
    margin-bottom: 12px;
  }
  .status {
    font-size: 0.85rem;
    color: #58a6ff;
    margin-bottom: 24px;
    min-height: 1.2em;
    text-align: center;
  }
  .station {
    display: block;
    width: 100%;
    max-width: 420px;
    font-family: inherit;
    color: #fff;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 16px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
  }
  .station:active { transform: scale(0.97); }
  .station.playing {
    border-color: #58a6ff;
    box-shadow: 0 0 24px rgba(88, 166, 255, 0.25);
  }
  #hot97 { position: relative; overflow: hidden; }
  #hot97 .viz {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  #hot97 .freq, #hot97 .name {
    position: relative;
    z-index: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .station .freq {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .station .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #3fb950;
    display: none;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .station.playing .dot { display: inline-block; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .station .name {
    font-size: 1rem;
    color: #8b949e;
    margin-top: 6px;
  }
  .hint {
    margin-top: 24px;
    font-size: 0.8rem;
    color: #484f58;
    text-align: center;
    line-height: 1.6;
  }
  .yt-card {
    width: 100%;
    max-width: 420px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 0;
    overflow: hidden;
    cursor: default;
    margin-bottom: 16px;
  }
  .yt-card:active { transform: none; }
  .yt-card.playing {
    border-color: #58a6ff;
    box-shadow: 0 0 24px rgba(88, 166, 255, 0.25);
  }
  .yt-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 20px 24px 12px;
  }
  .yt-card-label { font-size: 0.9rem; color: #8b949e; }
  .yt-live-btn {
    flex: none;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    background: #e11d48;
    border: 1px solid #e11d48;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .yt-live-btn.live-mode { background: #2f7de1; border-color: #2f7de1; }
  .yt-live-btn.live-mode .yt-live-dot { display: none; }
  .yt-live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .yt-card iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; }
  #yt-player-live-by, #yt-player-live-ss { display: none; }
  .yt-card .yt-link {
    display: block;
    text-align: center;
    color: #58a6ff;
    text-decoration: none;
    padding: 12px 12px 16px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <h1>Jungle's Links</h1>
  <div class="status" id="status">Tap something to open</div>

  <button class="station" id="hot97" data-stream="https://playerservices.streamtheworld.com/api/livestream-redirect/WQHTFMAAC_SC" data-name="HOT 97">
    <div class="freq"><span class="dot"></span>HOT 97</div>
    <div class="name">New York &middot; Hip-Hop</div>
  </button>

  <div class="yt-card" id="yt-card-by">
    <div class="yt-card-head"><div class="yt-card-label">The Basement Yard</div><button class="yt-live-btn" id="yt-live-btn-by" type="button"><span class="yt-live-dot"></span><span id="yt-live-btn-text-by">Check if live</span></button></div>
    <iframe id="yt-player-by" src="https://www.youtube.com/embed/videoseries?list=UU_a6c3KLo9reMOqn2pbvMqg&amp;enablejsapi=1" title="The Basement Yard latest video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <iframe id="yt-player-live-by" src="https://www.youtube.com/embed/live_stream?channel=UC_a6c3KLo9reMOqn2pbvMqg&amp;enablejsapi=1" title="The Basement Yard live feed" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <a class="yt-link" href="https://www.youtube.com/@TheBasementYard" target="_blank" rel="noopener">Open The Basement Yard on YouTube</a>
  </div>

  <a class="station" href="https://www.lookmovie2.to/shows/view/0121955-south-park-1997" target="_blank" rel="noopener">
    <div class="freq">South Park</div>
    <div class="name">Look👀</div>
  </a>

  <div class="yt-card" id="yt-card-ss">
    <div class="yt-card-head"><div class="yt-card-label">Santagato Studios</div><button class="yt-live-btn" id="yt-live-btn-ss" type="button"><span class="yt-live-dot"></span><span id="yt-live-btn-text-ss">Check if live</span></button></div>
    <iframe id="yt-player-ss" src="https://www.youtube.com/embed/videoseries?list=UUvNGMZ-FXlihsMECs-J1LUw&amp;enablejsapi=1" title="Santagato Studios latest video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <iframe id="yt-player-live-ss" src="https://www.youtube.com/embed/live_stream?channel=UCvNGMZ-FXlihsMECs-J1LUw&amp;enablejsapi=1" title="Santagato Studios live feed" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <a class="yt-link" href="https://www.youtube.com/@SantagatoStudios" target="_blank" rel="noopener">Open Santagato Studios on YouTube</a>
  </div>

  <div class="hint">Tap HOT 97 again to stop.</div>

<script>
(function () {
  var status = document.getElementById('status');
  var btn = document.getElementById('hot97');
  var audio = new Audio();
  audio.preload = 'none';
  var current = null;
  var audioCtx = null, analyser = null, audioElHasGraph = false;
  var vizMode = 'idle';
  var syncState = 'unknown';
  window.radioViz = { playing: false, analyser: null, mode: 'idle', current: null };
  var clickToken = 0;
  var fellBackToken = -1;

  function setViz(mode, playing) {
    vizMode = mode;
    window.radioViz.mode = mode;
    window.radioViz.playing = playing;
    window.radioViz.analyser = (mode === 'sync') ? analyser : null;
  }
  function stopAll() {
    try { audio.pause(); } catch (e) {}
    audio.removeAttribute('src');
    try { audio.load(); } catch (e) {}
    btn.classList.remove('playing');
    current = null;
    window.radioViz.current = null;
    setViz('idle', false);
  }
  window.jlStopAudio = stopAll;
  function onStarted() {
    btn.classList.add('playing');
    status.textContent = 'Now playing: HOT 97';
  }
  function startPlain() {
    audio.removeAttribute('crossorigin');
    audio.src = btn.getAttribute('data-stream');
    var p = audio.play();
    if (p && p.then) {
      p.then(function () { setViz('plain', true); onStarted(); }).catch(function () {
        status.textContent = 'Could not start HOT 97';
        stopAll();
      });
    } else { setViz('plain', true); onStarted(); }
  }
  function fallbackToPlain(token) {
    if (token !== clickToken || token === fellBackToken) return;
    fellBackToken = token;
    syncState = 'plain';
    try { audio.pause(); } catch (e) {}
    audio.removeAttribute('src');
    try { audio.load(); } catch (e) {}
    audio = new Audio();
    audio.preload = 'none';
    audioElHasGraph = false;
    bindError(audio);
    status.textContent = 'Connecting to HOT 97\u2026';
    startPlain();
  }
  function bindError(el) {
    el.addEventListener('error', function () {
      if (!current) return;
      if (vizMode === 'sync' && syncState !== 'sync') {
        fallbackToPlain(clickToken);
      } else {
        status.textContent = 'Stream failed to load';
        stopAll();
      }
    });
  }
  bindError(audio);
  function attemptSync() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (!analyser) analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      if (!audioElHasGraph) {
        var src = audioCtx.createMediaElementSource(audio);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        audioElHasGraph = true;
      }
      if (audioCtx.resume) audioCtx.resume();
    } catch (e) {
      syncState = 'plain';
      startPlain();
      return;
    }
    var token = clickToken;
    audio.crossOrigin = 'anonymous';
    audio.src = btn.getAttribute('data-stream');
    var p = audio.play();
    if (p && p.then) {
      p.then(function () {
        syncState = 'sync';
        setViz('sync', true);
        onStarted();
      }).catch(function () {
        if (syncState !== 'sync') fallbackToPlain(token);
        else { status.textContent = 'Could not start HOT 97'; stopAll(); }
      });
    } else {
      syncState = 'sync';
      setViz('sync', true);
      onStarted();
    }
  }
  btn.addEventListener('click', function () {
    if (window.jlPauseVideos) window.jlPauseVideos();
    if (window.jlRevertCards) window.jlRevertCards();
    if (current === btn) { stopAll(); status.textContent = 'Tap something to open'; return; }
    stopAll();
    current = btn;
    window.radioViz.current = btn;
    clickToken++;
    status.textContent = 'Connecting to HOT 97\u2026';
    if (syncState === 'plain') { setViz('plain', false); startPlain(); }
    else { setViz('sync', false); attemptSync(); }
  });
})();
</script>

<script>
(function () {
  var btn = document.getElementById('hot97');
  var c = document.createElement('canvas');
  c.className = 'viz';
  btn.appendChild(c);
  var ctx = c.getContext('2d');
  var dpr = 1, w = 0, h = 0, cur = [];
  var STOPS = ['#2a1200', '#ff7a29', '#ffc27a'];
  function sizeIt() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = btn.clientWidth;
    h = btn.clientHeight;
    if (!w || !h) return;
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    cur = [];
  }
  sizeIt();
  window.addEventListener('resize', sizeIt);
  window.addEventListener('load', sizeIt);
  var BAR_N = 20;
  var freqData = null;
  function draw() {
    requestAnimationFrame(draw);
    var viz = window.radioViz || {};
    var t = performance.now() / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var active = (viz.current === btn && viz.playing);
    if (!active) return;
    var analyser = (viz.mode === 'sync') ? viz.analyser : null;
    if (analyser) {
      if (!freqData || freqData.length !== analyser.frequencyBinCount) freqData = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(freqData);
    }
    var step = w / BAR_N;
    var bw = step * 0.62;
    var grad = ctx.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, STOPS[0]);
    grad.addColorStop(0.6, STOPS[1]);
    grad.addColorStop(1, STOPS[2]);
    ctx.fillStyle = grad;
    for (var b = 0; b < BAR_N; b++) {
      var target;
      if (analyser && freqData) {
        var bin = Math.floor(b * freqData.length / BAR_N);
        target = 0.08 + (freqData[bin] / 255) * (h * 0.72);
      } else {
        var beat = Math.pow(Math.max(0, Math.sin(t * 2.1)), 3);
        target = h * 0.08 + (0.5 + 0.5 * Math.sin(t * 2.6 + b * 0.55)) * (h * 0.28 + beat * h * 0.35);
      }
      var v = cur[b] || 0;
      v += (target - v) * 0.35;
      cur[b] = v;
      var x = b * step + (step - bw) / 2;
      var hh = Math.max(2, v);
      ctx.fillRect(x, h - hh, bw, hh);
    }
  }
  draw();
})();
</script>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
(function () {
  var status = document.getElementById('status');
  function stopAudio() { try { if (window.jlStopAudio) window.jlStopAudio(); } catch (e) {} }
  function makeCard(suffix, name) {
    return {
      suffix: suffix, name: name, liveMode: false,
      card: document.getElementById('yt-card-' + suffix),
      liveBtn: document.getElementById('yt-live-btn-' + suffix),
      liveBtnText: document.getElementById('yt-live-btn-text-' + suffix),
      mainFrame: document.getElementById('yt-player-' + suffix),
      liveFrame: document.getElementById('yt-player-live-' + suffix),
      latestPlayer: null, livePlayer: null
    };
  }
  var cards = [makeCard('by', 'The Basement Yard'), makeCard('ss', 'Santagato Studios')];
  function pauseCard(c) {
    try { if (c.latestPlayer && c.latestPlayer.pauseVideo) c.latestPlayer.pauseVideo(); } catch (e) {}
    try { if (c.livePlayer && c.livePlayer.pauseVideo) c.livePlayer.pauseVideo(); } catch (e) {}
  }
  function pauseAllVideos() { for (var i = 0; i < cards.length; i++) pauseCard(cards[i]); }
  function showLatest(c) {
    c.liveMode = false;
    pauseCard(c);
    if (c.liveFrame) c.liveFrame.style.display = 'none';
    if (c.mainFrame) c.mainFrame.style.display = 'block';
    if (c.liveBtn) c.liveBtn.classList.remove('live-mode');
    if (c.liveBtnText) c.liveBtnText.textContent = 'Check if live';
    if (c.card) c.card.classList.remove('playing');
    status.textContent = 'Tap something to open';
  }
  function revertAllCards() { for (var i = 0; i < cards.length; i++) showLatest(cards[i]); }
  window.jlPauseVideos = pauseAllVideos;
  window.jlRevertCards = revertAllCards;
  function showLive(c) {
    for (var i = 0; i < cards.length; i++) { if (cards[i] !== c) showLatest(cards[i]); }
    stopAudio();
    c.liveMode = true;
    try { if (c.latestPlayer && c.latestPlayer.pauseVideo) c.latestPlayer.pauseVideo(); } catch (e) {}
    if (c.mainFrame) c.mainFrame.style.display = 'none';
    if (c.liveFrame) c.liveFrame.style.display = 'block';
    if (c.liveBtn) c.liveBtn.classList.add('live-mode');
    if (c.liveBtnText) c.liveBtnText.textContent = 'Back to latest';
    if (c.card) c.card.classList.remove('playing');
    status.textContent = 'Live feed — tap play to watch';
    try { if (c.livePlayer && c.livePlayer.playVideo) c.livePlayer.playVideo(); } catch (e) {}
  }
  for (var j = 0; j < cards.length; j++) {
    (function (c) {
      if (c.liveBtn) {
        c.liveBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          if (!c.liveMode) { showLive(c); }
          else { showLatest(c); }
        });
      }
    })(cards[j]);
  }
  window.onYouTubeIframeAPIReady = function () {
    try {
      for (var k = 0; k < cards.length; k++) {
        (function (c) {
          var handler = function (e) {
            if (e.data === YT.PlayerState.PLAYING) {
              stopAudio();
              for (var m = 0; m < cards.length; m++) { if (cards[m] !== c) showLatest(cards[m]); }
              if (c.card) c.card.classList.add('playing');
              status.textContent = 'Watching: ' + c.name;
            } else if (c.card) { c.card.classList.remove('playing'); }
          };
          c.latestPlayer = new YT.Player('yt-player-' + c.suffix, { events: { 'onStateChange': handler } });
          c.livePlayer = new YT.Player('yt-player-live-' + c.suffix, { events: { 'onStateChange': handler } });
        })(cards[k]);
      }
    } catch (err) {}
  };
})();
</script>
